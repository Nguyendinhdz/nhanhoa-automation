<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/brand/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/img/brand/apple-touch-icon.png">
  <meta name="theme-color" content="#15222e">
  <meta property="og:site_name" content="Nhân Hòa Automation">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://nguyendinhdz.github.io/nhanhoa-automation/assets/img/brand/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <title>Chi tiết sản phẩm – {SITE}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <div class="container" id="detail"></div>
    <section class="container models" id="models" hidden></section>

    <section class="section section-alt" id="related-wrap">
      <div class="container">
        <div class="section-head"><h2>Sản phẩm cùng danh mục</h2></div>
        <div class="pgrid" id="related"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/sentech.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    initPage("products");

    const id = new URLSearchParams(location.search).get("id");
    const p = PRODUCTS.find((x) => x.id === id);
    const box = document.getElementById("detail");

    if (!p) {
      box.innerHTML = `<div class="section"><h1>Không tìm thấy sản phẩm</h1><p>Đường dẫn có thể đã thay đổi.</p><a class="btn btn-primary" href="san-pham.html">Về trang sản phẩm</a></div>`;
      document.getElementById("related-wrap").hidden = true;
    } else {
      document.title = p.name + " – " + SITE.name;
      const solutions = SOLUTIONS.filter((s) => s.stack.includes(p.id));

      box.innerHTML = `
        <div class="crumbs" style="padding-top:24px">
          <a href="index.html">Trang chủ</a> /
          <a href="san-pham.html?cat=${p.cat}">${catName(p.cat)}</a> /
          <a href="san-pham.html?cat=${p.cat}&sub=${p.sub}">${subName(p.cat, p.sub)}</a>
        </div>
        <div class="pd">
          <div>
            <div class="pd-img">${productImage(p)}</div>
            ${p.imageFull ? `<figure class="pd-full"><img src="${p.imageFull}" alt="${p.name} – vùng nhìn" loading="lazy" referrerpolicy="no-referrer" onerror="this.closest('figure').remove()"><figcaption>Vùng nhìn (FOV) – ảnh: Mech-Mind</figcaption></figure>` : ""}
          </div>
          <div>
            <a class="pd-brand" href="san-pham.html?brand=${p.brand}">${brandName(p.brand)}</a>
            <h1>${p.name}</h1>
            <p class="pd-lead">${p.short}</p>
            <table class="specs">
              ${Object.entries(p.specs).map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join("")}
            </table>
            <div class="pd-actions">
              <div class="qty">
                <button type="button" id="minus" aria-label="Giảm">−</button>
                <input type="number" id="qty" value="1" min="1" aria-label="Số lượng">
                <button type="button" id="plus" aria-label="Tăng">+</button>
              </div>
              <button class="btn btn-primary" id="add">Thêm vào báo giá</button>
              <a class="btn btn-ghost" href="bao-gia.html#lien-he">Hỏi kỹ sư</a>
            </div>
            <p class="note">Thông số mang tính tham khảo. Cấu hình chính xác (model, ống kính, đèn) được kỹ sư chọn theo mẫu và yêu cầu của bạn.</p>
            ${p.video ? `<h3 style="margin-top:26px">Video giới thiệu</h3>${videoEmbed(p.video, p.name)}` : ""}
            ${solutions.length ? `<p style="margin-top:18px"><strong>Dùng trong giải pháp:</strong> ${solutions.map((s) => `<a href="giai-phap.html#${s.id}">${s.name}</a>`).join(", ")}</p>` : ""}
          </div>
        </div>`;

      const qty = document.getElementById("qty");
      document.getElementById("minus").onclick = () => (qty.value = Math.max(1, +qty.value - 1));
      document.getElementById("plus").onclick = () => (qty.value = +qty.value + 1);
      document.getElementById("add").onclick = () => Quote.add(p.id, Math.max(1, +qty.value || 1));

      if (p.models) renderModels(p);

      const related = PRODUCTS.filter((x) => x.cat === p.cat && x.id !== p.id).slice(0, 4);
      if (related.length) document.getElementById("related").innerHTML = related.map(productCard).join("");
      else document.getElementById("related-wrap").hidden = true;
    }

    /* Bảng toàn bộ model của một dòng camera (Sentech) */
    function renderModels(p) {
      const el = document.getElementById("models");
      const H = { "ProductModel": "Model", "Color /Monochrome": "Mono / Màu", "Resolutions": "Độ phân giải", "EffectivePixels": "Số điểm ảnh",
        "Frame Rate": "Tốc độ khung", "Line Rate": "Tốc độ dòng", "LensMount": "Ngàm", "Dimensions(mm)": "Kích thước", "ImageSensor": "Cảm biến",
        "OpticalSize": "Cỡ quang học", "CellSize": "Kích thước pixel", "ShutterType": "Màn trập", "Interface": "Giao tiếp" };
      const head = p.modelHead.map((h) => H[h] || h);
      const kinds = [...new Set(p.models.map((r) => r[1]))];
      let kind = "", q = "";

      el.hidden = false;
      el.innerHTML = `
        <div class="section-head" style="margin-bottom:18px">
          <h2>Danh sách model (${p.models.length})</h2>
          <p>Bấm "Báo giá" ở từng dòng để thêm đúng model vào danh sách báo giá.</p>
        </div>
        <div class="models-bar">
          <div class="search"><input type="search" id="mq" placeholder="Tìm model, cảm biến, độ phân giải…" aria-label="Tìm model"></div>
          ${kinds.length > 1 ? `<div class="seg" id="mkind"><button class="is-active" data-k="">Tất cả</button>${kinds.map((k) => `<button data-k="${k}">${k === "Monochrome" ? "Mono" : k === "Color" ? "Màu" : k}</button>`).join("")}</div>` : ""}
          <span class="result-count" id="mcount"></span>
        </div>
        <div class="mtable-wrap"><table class="mtable"><thead><tr>${head.map((h) => `<th>${h}</th>`).join("")}<th></th></tr></thead><tbody id="mbody"></tbody></table></div>
        <p class="source-note">Thông số theo <a href="${p.source}" target="_blank" rel="noopener">trang OMRON Sentech</a>. Vui lòng xác nhận lại với chúng tôi trước khi đặt hàng.</p>`;

      const draw = () => {
        const ql = q.trim().toLowerCase();
        const rows = p.models.filter((r) => (!kind || r[1] === kind) && (!ql || r.join(" ").toLowerCase().includes(ql)));
        document.getElementById("mcount").textContent = `${rows.length} model`;
        document.getElementById("mbody").innerHTML = rows.map((r) => `<tr>
          ${head.map((_, i) => i === 0 ? `<td>${r[0]}${r[head.length] === 1 ? '<span class="tag-new">MỚI</span>' : ""}</td>` : `<td>${r[i] || ""}</td>`).join("")}
          <td><button class="btn btn-primary btn-xs" data-add-quote="${p.id}::${r[0]}">Báo giá</button></td></tr>`).join("")
          || `<tr><td colspan="${head.length + 1}">Không có model khớp. Thử từ khóa khác.</td></tr>`;
      };
      document.getElementById("mq").addEventListener("input", (e) => { q = e.target.value; draw(); });
      const seg = document.getElementById("mkind");
      if (seg) seg.addEventListener("click", (e) => {
        const b = e.target.closest("button"); if (!b) return;
        kind = b.dataset.k; seg.querySelectorAll("button").forEach((x) => x.classList.toggle("is-active", x === b)); draw();
      });
      draw();
    }
  </script>
</body>
</html>
